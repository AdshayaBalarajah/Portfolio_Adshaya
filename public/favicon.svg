<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e1a"/>
      <stop offset="100%" stop-color="#12091f"/>
    </linearGradient>
    <linearGradient id="code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Subtle inner border -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="21" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>
  <!-- </> icon -->
  <g filter="url(#glow)" fill="none" stroke="url(#code)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- < -->
    <polyline points="32,36 18,50 32,64"/>
    <!-- > -->
    <polyline points="68,36 82,50 68,64"/>
    <!-- / -->
    <line x1="56" y1="32" x2="44" y2="68"/>
  </g>
</svg>